services:
  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.10.0
    container_name: jaeger-arvo-tool
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_OTLP_HTTP_HOST_PORT=:4318
      - COLLECTOR_OTLP_GRPC_HOST_PORT=:4317
    ports:
      - "4318:4318"    # OTLP HTTP receiver
      - "16686:16686"  # Jaeger UI
    networks:
      - arvo-tools-network

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: phoenix-arvo-tool
    ports:
      - "6006:6006"    # Phoenix UI & traces
    networks:
      - arvo-tools-network  

  postgres:
    image: postgres:latest
    container_name: arvo-postgres-arvo-tool
    environment:
      POSTGRES_USER: arvo
      POSTGRES_PASSWORD: arvo
      POSTGRES_DB: arvo
    ports:
      - "5432:5432"
    volumes:
      - arvo_postgres_data:/var/lib/postgresql

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy-arvo-tool
    ports:
      - "6001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - jaeger
      - phoenix
    networks:
      - arvo-tools-network

networks:
  arvo-tools-network:
    driver: bridge

volumes:
  arvo_postgres_data:
